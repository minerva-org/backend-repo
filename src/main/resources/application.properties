spring.application.name=api
spring.profiles.active=dev
# Configuracion de la base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:minerva}} 
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:minerva}} 
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}} 
spring.jpa.hibernate.ddl-auto=validate 
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC
jwt.secret=${JWT_SECRET:QmFja2VuZC1EZXZlbG9wbWVudC1TZWNyZXQtS2V5LTEyMzQ1Ng==}
server.port=8080
logging.level.org.springframework.security=DEBUG

# Almacenamiento compatible con S3 (MinIO local por defecto)
app.storage.s3.endpoint=${S3_ENDPOINT:http://minio:9000}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:minerva-documents-dev}
app.storage.s3.path-style=${S3_PATH_STYLE:true}
app.storage.s3.access-key=${S3_ACCESS_KEY}
app.storage.s3.secret-key=${S3_SECRET_KEY}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Conexion interna Minerva API -> AI-Service
app.ai.service.base-url=${AI_SERVICE_BASE_URL:http://host.docker.internal:8000}
app.ai.service.api-key=${AI_SERVICE_API_KEY:}
