services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minerva-postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}'
      - 'SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}'
      - 'SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}'
      - 'JWT_SECRET=${JWT_SECRET}'
      - 'SPRING_PROFILES_ACTIVE=dev'
      - 'AI_SERVICE_BASE_URL=${AI_SERVICE_BASE_URL:-http://host.docker.internal:8000}'
      - 'AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:?Configura AI_SERVICE_API_KEY en backend-repo/.env}'
      - 'CURRICULUM_MOCK_ENABLED=${CURRICULUM_MOCK_ENABLED:false}'
      - 'S3_ENDPOINT=${S3_ENDPOINT-http://minio:9000}'
      - 'S3_REGION=${S3_REGION:-us-east-1}'
      - 'S3_BUCKET=${S3_BUCKET:-minerva-documents-dev}'
      - 'S3_PATH_STYLE=${S3_PATH_STYLE:-true}'
      - 'S3_ACCESS_KEY=${S3_ACCESS_KEY:?Configura S3_ACCESS_KEY en backend-repo/.env}'
      - 'S3_SECRET_KEY=${S3_SECRET_KEY:?Configura S3_SECRET_KEY en backend-repo/.env}'
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
  
  caddy:
    image: caddy:2
    ports:
    - "127.0.0.1:${CADDY_PORT:-8090}:80"
    volumes:
    - "./Caddyfile:/etc/caddy/Caddyfile:ro"
    - "../frontend-repo/apps/web/dist:/srv:ro"
    depends_on:
    - api
    restart: unless-stopped

  minio:
    image: quay.io/minio/aistor/minio:latest
    command: ["server", "/mnt/data", "--console-address", ":9001", "--license", "/minio.license"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Configura MINIO_ROOT_USER en backend-repo/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Configura MINIO_ROOT_PASSWORD en backend-repo/.env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/mnt/data
      - ./minio.license:/minio.license:ro
    restart: unless-stopped
volumes:
  minerva-postgres-data:
  minio-data:
